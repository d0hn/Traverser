[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traverser"
version = "0.1.0"
description = "AI-powered documentation generator — builds NotebookLM-ready knowledge bases from GitHub repositories"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Maciej Koniarek", email = "mkoniarek@fandom.com" },
]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "PyGithub>=2.3.0",
    "gitpython>=3.1.42",
    "openai>=1.30.0",
    "anthropic>=0.26.0",
    "networkx>=3.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
    "diskcache>=5.6.3",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-aiofiles>=23.2.0.20240311",
]

[project.scripts]
traverser = "traverser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/traverser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/traverser --cov-report=term-missing -v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
